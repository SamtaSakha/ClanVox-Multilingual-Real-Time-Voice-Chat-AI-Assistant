# ClanVox Locales & Dialects Configuration (Gap 2)
# Defines dialect profiles, formality rules, pronoun systems, and cultural lexicons

locales:
  en-US:
    base_language: en
    region: "United States"
    default_formality: informal
    pronoun_system: standard
    stt: { primary: deepgram, model: "nova-3" }
    tts: { voice: "en-US-JennyNeural" }
    tts_voices:
      female: { name: "Aria", voice_id: "en-US-JennyNeural" }
      male: { name: "Leo", voice_id: "en-US-GuyNeural" }

  en-IN:
    base_language: en
    region: "India"
    default_formality: polite
    pronoun_system: standard
    allow_code_switch: ["hi"]
    stt: { primary: deepgram, model: "nova-3" }
    tts: { voice: "en-IN-NeerjaNeural" }
    tts_voices:
      female: { name: "Neerja", voice_id: "en-IN-NeerjaNeural" }
      male: { name: "Prabhat", voice_id: "en-IN-PrabhatNeural" }
    slang_lexicon: "config/culture/en-IN/slang.jsonl"
    exemplars: "config/culture/en-IN/exemplars.jsonl"

  hi-IN:
    base_language: hi
    region: "India (North/Central)"
    allow_code_switch: ["en"]
    default_formality: neutral_polite   # "आप" by default
    script_preference: devanagari
    stt: { primary: deepgram, model: "nova-3" }
    tts: { voice: "hi-IN-SwaraNeural" }
    tts_voices:
      female: { name: "Swara", voice_id: "hi-IN-SwaraNeural" }
      male: { name: "Aarav", voice_id: "hi-IN-MadhurNeural" }
    slang_lexicon: "config/culture/hi-IN/slang.jsonl"
    exemplars: "config/culture/hi-IN/exemplars.jsonl"

  es-AR:
    base_language: es
    region: "Argentina (Rioplatense)"
    pronoun_system: vos                 # "vos tenés" not "tú tienes"
    default_formality: informal
    stt: { primary: google, custom_vocab: "vocab/es-AR.txt" }
    tts: { voice: "es-AR-ElenaNeural" }
    tts_voices:
      female: { name: "Elena", voice_id: "es-AR-ElenaNeural" }
      male: { name: "Tomas", voice_id: "es-AR-TomasNeural" }
    slang_lexicon: "config/culture/es-AR/slang.jsonl"
    exemplars: "config/culture/es-AR/exemplars.jsonl"

  es-MX:
    base_language: es
    region: "Mexico"
    pronoun_system: tu
    default_formality: informal
    stt: { primary: azure }
    tts: { voice: "es-MX-DaliaNeural" }
    tts_voices:
      female: { name: "Dalia", voice_id: "es-MX-DaliaNeural" }
      male: { name: "Jorge", voice_id: "es-MX-JorgeNeural" }

  ar-EG:
    base_language: ar
    region: "Egypt (Cairo)"
    spoken_variety: egyptian_colloquial  # reply in dialect, not MSA
    default_formality: informal
    stt: { primary: azure }
    tts: { voice: "ar-EG-SalmaNeural" }
    tts_voices:
      female: { name: "Salma", voice_id: "ar-EG-SalmaNeural" }
      male: { name: "Shakir", voice_id: "ar-EG-ShakirNeural" }
    slang_lexicon: "config/culture/ar-EG/slang.jsonl"
    exemplars: "config/culture/ar-EG/exemplars.jsonl"

  ja-JP:
    base_language: ja
    region: "Japan"
    default_formality: formal           # teineigo/keigo (です・ます)
    stt: { primary: azure }
    tts: { voice: "ja-JP-NanamiNeural" }
    tts_voices:
      female: { name: "Nanami", voice_id: "ja-JP-NanamiNeural" }
      male: { name: "Keita", voice_id: "ja-JP-KeitaNeural" }
