# ClanVox Language Registry & Tier Configuration
# Tier 1: Real-time, ultra-low latency, code-switching, full voice support
# Tier 2: Real-time voice, standard models, high accuracy
# Tier 3: Beta / experimental, specialist models, confidence gating

languages:
  en:
    name: "English"
    native_name: "English"
    tier: 1
    script: "LATIN"
    default_locale: "en-US"
    allowed_locales: ["en-US", "en-GB", "en-IN", "en-AU", "en-NG"]
    stt_primary: "deepgram"
    stt_fallback: "whisper"
    tts_primary: "cartesia"
    tts_voice: "en-US-JennyNeural"
    min_silence_ms: 450

